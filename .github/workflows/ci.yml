name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.affected.outputs.count }}
      matrix: ${{ steps.affected.outputs.matrix }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository tooling
        run: pnpm check:repo

      - name: Resolve comparison revisions
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            head="$PR_HEAD_SHA"
            base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" 2>/dev/null || true)"
            if [ -z "$base" ]; then
              base="0000000000000000000000000000000000000000"
            fi
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Select affected applications
        id: affected
        run: >-
          pnpm affected:apps
          --base "${{ steps.revisions.outputs.base }}"
          --head "${{ steps.revisions.outputs.head }}"
          --github-output "$GITHUB_OUTPUT"

  applications:
    needs: repository
    if: needs.repository.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.repository.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          cache: pnpm
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate selected application
        env:
          PACKAGE_NAME: ${{ matrix.packageName }}
        run: pnpm --filter "$PACKAGE_NAME" --fail-if-no-match run check

      - name: Smoke selected application image
        env:
          PACKAGE_NAME: ${{ matrix.packageName }}
        run: pnpm --filter "$PACKAGE_NAME" --fail-if-no-match run image:smoke
